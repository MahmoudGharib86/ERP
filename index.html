@keyframes meyarFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes meyarGlow{0%,100%{opacity:.55;filter:blur(18px)}50%{opacity:.95;filter:blur(26px)}}
@keyframes meyarSlideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes meyarPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.meyar-reveal{animation:meyarSlideUp .48s cubic-bezier(.2,.8,.2,1) both}
.meyar-card{position:relative;overflow:hidden;isolation:isolate}
.meyar-card::before{content:"";position:absolute;inset:-1px;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,0));opacity:.6;pointer-events:none;z-index:-1}
.meyar-card::after{content:"";position:absolute;width:120px;height:120px;border-radius:999px;inset:auto -44px -52px auto;background:var(--gold);opacity:.10;filter:blur(4px);pointer-events:none}
.meyar-nav button:hover{transform:translateX(var(--hover-x,-4px)) scale(1.015)!important;background:linear-gradient(135deg,rgba(244,201,93,.16),rgba(255,255,255,.06))!important}
body.en .meyar-nav button:hover{--hover-x:4px}
.meyar-chart-line{stroke-dasharray:900;stroke-dashoffset:900;animation:dash 1.4s ease forwards}
@keyframes dash{to{stroke-dashoffset:0}}

/* Meyar compact report typography patch */
.report-compact *, .meyar-report * { font-size: 12px; }
.num,.amount,.number,[dir="ltr"]{font-family:'Yu Gothic Medium',Arial,sans-serif!important;}

/* Meyar reports typography consistency fix */
.meyar-reports-page{font-size:11.5px!important;}
.meyar-reports-page *{font-size:11.5px!important;line-height:1.45!important;}
.meyar-reports-page h1,.meyar-reports-page h2{font-size:16px!important;line-height:1.25!important;font-weight:800!important;}
.meyar-reports-page h3{font-size:13px!important;font-weight:800!important;}
.meyar-reports-page p,.meyar-reports-page label,.meyar-reports-page span{font-size:10.5px!important;}
.meyar-reports-page input,.meyar-reports-page select{font-size:10.5px!important;height:30px!important;padding:4px 8px!important;border-radius:8px!important;}
.meyar-reports-page button{font-size:10.5px!important;padding:6px 10px!important;border-radius:8px!important;}
.meyar-reports-page table{font-size:11px!important;}
.meyar-reports-page table th{font-size:10.5px!important;padding:8px 10px!important;font-weight:800!important;}

.meyar-reports-page table td strong,.meyar-reports-page table td b{font-size:11.2px!important;}
.meyar-reports-page .amount,.meyar-reports-page .num,.meyar-reports-page .number{font-family:'Yu Gothic Medium',Arial,sans-serif!important;font-size:11.2px!important;font-weight:500!important;}
.meyar-reports-page .meyar-card{padding:9px!important;min-height:66px!important;border-radius:12px!important;}

.meyar-reports-page > div:first-child{margin-bottom:10px!important;}
.meyar-reports-page > div{max-width:100%;}


.dashboard-hero,.hero-banner,.executive-banner{display:none !important;}
.dashboard-card,.stat-card,.kpi-card{
min-height:140px !important;
padding:18px !important;
border-radius:22px !important;
}
.dashboard-card .value,.stat-card .value,.kpi-card .value{
font-size:24px !important;
}

/* Meyar v13.3 single official theme */

.dashboard-card .value,.stat-card .value,.kpi-card .value,.meyar-card .value{font-size:20px!important;}

/* Meyar v13.4 professional visual refinement */
body{background:linear-gradient(135deg,#F8FAFC 0%,#EEF4FF 48%,#F6F7FB 100%)!important;}
.meyar-card{box-shadow:0 14px 36px rgba(15,23,42,.08)!important;border-color:#D9E2EF!important;}
.meyar-reports-page table th{background:#0B1220!important;color:#F4C95D!important;}
button{transition:all .2s ease!important;}
button:hover{filter:brightness(1.03);}


/* v13.5 — Stop dashboard/card motion */
.meyar-reveal{animation:none!important;}
.meyar-card, .meyar-card *, .meyar-reveal, .meyar-reveal *{animation:none!important;}
.meyar-card:hover{transform:none!important;}
.meyar-card *{transition:background-color .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease!important;}
.meyar-chart-line{stroke-dasharray:none!important;stroke-dashoffset:0!important;animation:none!important;}

// ═══════════════════════════════════════════════════════════════
// MEYAR v15.2 — Stabilization & Data Integrity Layer
// Keeps the existing dashboard/UI shape while strengthening data safety.
// ═══════════════════════════════════════════════════════════════
const MEYAR_STABILIZATION_VERSION = "v15.2";
function meyarClone(obj){ try { return JSON.parse(JSON.stringify(obj || {})); } catch(e){ return obj; } }
function meyarPeriodStatus(co, date){
  if(!date || !co || !co.periods) return "";
  const ym = String(date).slice(0,7);
  for(const y of (co.periods||[])){
    const m = (y.months||[]).find(x => x.month === ym);
    if(m) return m.status || "";
  }
  return "";
}
function meyarIsClosedDate(co, date){
  const st = meyarPeriodStatus(co, date);
  return st === "مغلق" || st === "closed" || st === "Closed";
}
function meyarAccountHasMovement(co, code){
  if(!co || !code) return false;
  const c = String(code);
  if(Math.abs(Number((co.openingBalances||{})[c] || 0)) > 0.004) return true;
  for(const j of (co.journal||[])) for(const l of (j.lines||[])) if(String(l.account) === c && Math.abs(Number(l.amount||0)) > 0.004) return true;
  for(const inv of (co.invoices||[])) for(const it of (inv.items||[])) if(String(it.account||"") === c && Math.abs(Number(it.total||it.amount||0)) > 0.004) return true;
  return false;
}
function meyarRebuildMissingProtectedAccounts(prev, next){
  if(!prev || !next) return next;
  const nextCodes = new Set((next.accounts||[]).map(a => String(a.code)));
  const restored = [];
  for(const acc of (prev.accounts||[])){
    if(!nextCodes.has(String(acc.code)) && meyarAccountHasMovement(prev, acc.code)) restored.push({...acc, _protectedRestored:true});
  }
  if(restored.length) next.accounts = [...(next.accounts||[]), ...restored].sort((a,b)=>String(a.code).localeCompare(String(b.code),'en',{numeric:true}));
  return next;
}
function meyarProtectClosedPeriodJournals(prev, next){
  if(!prev || !next) return next;
  const nextMap = new Map((next.journal||[]).map(j => [String(j.id), j]));
  const merged = [...(next.journal||[])];
  for(const oldJ of (prev.journal||[])){
    if(!oldJ || !meyarIsClosedDate(prev, oldJ.date)) continue;
    const newJ = nextMap.get(String(oldJ.id));
    const changed = JSON.stringify(oldJ) !== JSON.stringify(newJ);
    if(!newJ) merged.push({...oldJ, _protectedClosed:true});
    else if(changed){
      const idx = merged.findIndex(j => String(j.id) === String(oldJ.id));
      if(idx >= 0) merged[idx] = {...oldJ, _protectedClosed:true};
    }
  }
  next.journal = merged;
  return next;
}
function meyarValidateJournals(co){
  if(!co) return co;
  const accounts = new Map((co.accounts||[]).map(a => [String(a.code), a]));
  co.journal = (co.journal||[]).map(j => {
    const lines = (j.lines||[]).filter(l => {
      const acc = accounts.get(String(l.account));
      return acc && !acc.isHeader && Math.abs(Number(l.amount||0)) > 0;
    });
    const d = lines.filter(l=>l.nature === "مدين").reduce((s,l)=>s+Number(l.amount||0),0);
    const c = lines.filter(l=>l.nature === "دائن").reduce((s,l)=>s+Number(l.amount||0),0);
    return {...j, lines, balanced: Math.abs(d-c) < 0.01, posted: (j.posted && Math.abs(d-c) < 0.01)};
  });
  return co;
}
function meyarAddAudit(prev, next, action){
  try{
    const oldAudit = (prev && prev.auditTrail) || [];
    const stamp = new Date().toISOString();
    const entry = {id: uid ? uid() : Date.now(), at: stamp, action: action || "Company data updated", user: "admin", version: MEYAR_STABILIZATION_VERSION};
    next.auditTrail = [...oldAudit.slice(-249), entry];
  }catch(e){}
  return next;
}
function meyarStabilizeCompany(prev, draft, action){
  let next = normalizeCompany(meyarClone(draft));
  next = meyarRebuildMissingProtectedAccounts(prev, next);
  next = meyarProtectClosedPeriodJournals(prev, next);
  next = meyarValidateJournals(next);
  next = meyarAddAudit(prev, next, action);
  next._stabilizedBy = MEYAR_STABILIZATION_VERSION;
  return next;
}
function meyarCleanForStorage(state){
  const clean = JSON.parse(JSON.stringify(state, (k, v) => {
    if (k === "dataUrl") return undefined;
    if (k === "_temp" || k === "_ui") return undefined;
    return v;
  }));
  clean._version = typeof LS_VERSION !== 'undefined' ? LS_VERSION : MEYAR_STABILIZATION_VERSION;
  clean._stabilization = MEYAR_STABILIZATION_VERSION;
  clean._savedAt = new Date().toISOString();
  return clean;
}
function meyarBackupState(clean){
  try{
    const key = "meyar_erp_backup_" + new Date().toISOString().slice(0,10);
    localStorage.setItem(key, JSON.stringify(clean));
    const keys = Object.keys(localStorage).filter(k=>k.startsWith("meyar_erp_backup_")).sort();
    while(keys.length > 7){ localStorage.removeItem(keys.shift()); }
  }catch(e){}
}
const fmt = n => Number(n || 0).toLocaleString("en-US");
const fmtC = n => fmt(n);
function setTargetSub(page, sub) {
  try { localStorage.setItem("meyar_target_sub", JSON.stringify({ page, sub })); } catch(e) {}
}
function takeTargetSub(page, fallback) {
  try {
    const raw = localStorage.getItem("meyar_target_sub");
    if (raw) {
      const t = JSON.parse(raw);
      if (t && t.page === page && t.sub) {
        localStorage.removeItem("meyar_target_sub");
        return t.sub;
      }

function normalizeCompany(co){

function calcCustomerBalance(co, customerId, asOf=today()) {
  const id = Number(customerId) || customerId;
  const c = (co.customers||[]).find(x => x.id === id || x.id === Number(id));
  const opening = Number(c?.balance || 0);
  const inv = (co.invoices||[]).filter(i => i.type === "sales" && i.status !== "ملغي" && (i.customerId === id || i.customerId === Number(id)) && (!asOf || i.date <= asOf)).reduce((sum,i)=>sum+Number(i.total||0),0);
  const rec = (co.receipts||[]).filter(r => r.type === "receipt" && (r.partyId === id || r.partyId === Number(id)) && (!asOf || r.date <= asOf)).reduce((sum,r)=>sum+Number(r.amount||0),0);

      cogs:accountsByPrefix(co,'5',from,to),
      exp:accountsByPrefix(co,'6',from,to),
      oi:accountsByPrefix(co,'7',from,to),
      loss:accountsByPrefix(co,'8',from,to)
    };
    const lineRows=[
      {label:isEn?'Revenue':'الإيرادات',key:'rev',openable:true},
      {label:isEn?'Cost of Revenue':'تكلفة الإيرادات',key:'cogs',openable:true},
      {label:isEn?'Gross Profit':'مجمل الربح',key:'gross',bold:true},
      {label:isEn?'Operating Expenses':'المصروفات التشغيلية',key:'exp',openable:true},
      {label:isEn?'Operating Profit':'ربح التشغيل',key:'op',bold:true},
      {label:isEn?'Other Income':'إيرادات أخرى',key:'oi',openable:true},
      {label:isEn?'Other Losses':'خسائر أخرى',key:'loss',openable:true},
      {label:isEn?'Net Profit / (Loss)':'صافي الربح / (الخسارة)',key:'net',bold:true,total:true}
    ];
    const toggle=k=>setOpen(o=>({...o,[k]:!o[k]}));
    const rowStyle=r=>({background:r.total?(cur.net>=0?C.successL:C.dangerL):(r.bold?C.beigeL:'#fff'),fontWeight:r.bold?900:700,cursor:r.openable?'pointer':'default'});
    const detailsFor=(key)=>detailRows[key]||[];
    const compValueForDetail=(code,idx)=>{ const p=comps[idx]; if(!p) return 0; const a=(co.accounts||[]).find(x=>x.code===code); return a?periodAmount(co,a,p.from,p.to):0; };
    const html=`<table><thead><tr><th>${isEn?'Item':'البند'}</th>${labels.map(x=>`<th class="amount">${x}</th>`).join('')}</tr></thead><tbody>${lineRows.map(r=>`<tr class="${r.bold?'total':''}"><td>${r.label}</td>${vals.map(v=>`<td class="amount num">${rNum(v[r.key])}</td>`).join('')}</tr>${r.openable?detailsFor(r.key).map(x=>`<tr><td style="padding-inline-start:26px">${x.a.code} - ${accName(x.a)}</td><td class="amount num">${rNum(Math.abs(x.amount))}</td>${comps.map(c=>`<td class="amount num">${rNum(Math.abs(periodAmount(co,x.a,c.from,c.to)))}</td>`).join('')}</tr>`).join(''):''}`).join('')}</tbody></table>`;
    const incomeTable=h('div',{style:{overflowX:'auto',border:'1px solid '+C.beige,borderRadius:16,background:'#fff',marginBottom:16}},
      h('table',{style:{width:'100%',borderCollapse:'collapse',minWidth:760}},
        h('thead',null,
          h('tr',{style:{background:C.navy}},[isEn?'Item':'البند',...labels].map((x,i)=>h('th',{key:i,style:{padding:'11px 12px',fontSize:11,fontWeight:900,color:C.gold,textAlign:i?'end':'start'}},x)))
        ),
        h('tbody',null,
          lineRows.map(r=>[
            h('tr',{key:r.key,onClick:r.openable?()=>toggle(r.key):undefined,style:rowStyle(r)},
              h('td',{style:{padding:10,display:'flex',alignItems:'center',gap:8}},
                r.openable?h('span',{style:{display:'inline-flex',width:22,height:22,borderRadius:8,alignItems:'center',justifyContent:'center',background:open[r.key]?C.goldL:C.beigeL,color:C.navy,fontWeight:950,border:'1px solid '+C.beige}},open[r.key]?'−':'+'):null,
                h('span',null,r.label)
              ),
              ...vals.map((v,i)=>h('td',{key:i,style:{padding:10,textAlign:'end',fontFamily:'Yu Gothic Medium'}},rNum(v[r.key])))
            ),
            (r.openable&&open[r.key])?detailsFor(r.key).map(x=>h('tr',{key:r.key+'-'+x.a.code,style:{background:'#fff'}},
              h('td',{style:{padding:'8px 10px 8px 34px',display:'grid',gridTemplateColumns:'92px 1fr',gap:8,color:C.muted,borderTop:'1px solid '+C.beigeL}},
                h('span',{style:{fontFamily:'Yu Gothic Medium'}},x.a.code),
                h('span',null,accName(x.a))
              ),
              h('td',{style:{padding:8,textAlign:'end',fontFamily:'Yu Gothic Medium',borderTop:'1px solid '+C.beigeL}},rNum(Math.abs(x.amount))),
              ...comps.map((c,i)=>h('td',{key:i,style:{padding:8,textAlign:'end',fontFamily:'Yu Gothic Medium',borderTop:'1px solid '+C.beigeL,color:C.muted}},rNum(Math.abs(periodAmount(co,x.a,c.from,c.to)))))
            )):null
          ])
        )
      )
    );
    return h('div',null,
      h(SH,{title:isEn?'Statement of Profit or Loss':'قائمة الربح أو الخسارة',sub:periodTxt(from,to),action:h(ActionButtons,{title:isEn?'Statement of Profit or Loss':'قائمة الربح أو الخسارة',html,co,from,to})}),
      h(ReportToolbar,{from,setFrom,to,setTo,compare,setCompare}),
      h('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:16}},
        mini(isEn?'Revenue':'الإيرادات',rNum(cur.rev),'sales',C.navy),
        mini(isEn?'Gross Profit':'مجمل الربح',rNum(cur.gross),'trend',cur.gross>=0?C.success:C.danger,rPct(cur.margin)),
        mini(isEn?'Operating Profit':'ربح التشغيل',rNum(cur.op),'accounting',cur.op>=0?C.success:C.danger),
        mini(cur.net>=0?(isEn?'Net Profit':'صافي الربح'):(isEn?'Net Loss':'صافي الخسارة'),rNum(Math.abs(cur.net)),'money',cur.net>=0?C.success:C.danger)
      ),
      incomeTable
    );
  };

  BalanceSheet = function BalanceSheet({co}){
    co=safeCo(co); const isEn=_lang==='en';
    const [from,setFrom]=useState(new Date().getFullYear()+'-01-01'),[to,setTo]=useState(today()),[compare,setCompare]=useState('none');
    const [open,setOpen]=useState({});
    const revR=accountsByPrefix(co,'4',from,to), cogsR=accountsByPrefix(co,'5',from,to), expR=accountsByPrefix(co,'6',from,to), oiR=accountsByPrefix(co,'7',from,to), lossR=accountsByPrefix(co,'8',from,to);
    const periodProfit=total(revR)-total(cogsR)-total(expR)+total(oiR)-total(lossR);
    const yearProfitAcc=(co.accounts||[]).find(a=>String(a.code)==='340101001')||{code:'340101001',name:'أرباح / خسائر السنة',nameEn:'Current Year Profit / Loss',parent:'34',type:'حقوق الملكية',nature:'دائن',isHeader:false};
    const leafAmount=(a)=>{
      let v=closeBalance(co,a.code,to);
      if(String(a.code)==='340101001') v += periodProfit;
      return v;
    };
    const periodMove=(code)=>{
      let d=0, cr=0;
      (getEffectiveJournal(co)||[]).filter(j=>j.posted && j.date>=from && j.date<=to).forEach(j=>(j.lines||[]).filter(l=>String(l.account)===String(code)).forEach(l=>{
        if(l.nature==='مدين') d+=Number(l.amount||0); else cr+=Number(l.amount||0);
      }));
      return Math.abs(d)+Math.abs(cr);
    };
    const childrenOf=(code,prefix)=> (co.accounts||[]).filter(a=>String(a.parent||'')===String(code) && String(a.code).startsWith(prefix)).sort((a,b)=>String(a.code).localeCompare(String(b.code),'en',{numeric:true}));
    const topAccounts=(prefix)=> (co.accounts||[]).filter(a=>String(a.code).startsWith(prefix) && (!a.parent || !String(a.parent).startsWith(prefix))).sort((a,b)=>String(a.code).localeCompare(String(b.code),'en',{numeric:true}));
    const aggregate=(a)=>{
      if(!a.isHeader) return leafAmount(a);
      const childs=childrenOf(a.code,String(a.code));
      return childs.reduce((s,c)=>s+aggregate(c),0);
    };
    const hasReportValue=(a,prefix)=>{
      const amount=aggregate(a);
      if(Math.abs(amount)>0.004) return true;
      if(!a.isHeader) return periodMove(a.code)>0.004 || String(a.code)==='340101001' && Math.abs(periodProfit)>0.004;
      return childrenOf(a.code,prefix||String(a.code)).some(c=>hasReportValue(c,prefix||String(a.code)));
    };
    const sectionTotal=(prefix)=> topAccounts(prefix).filter(a=>hasReportValue(a,prefix)).reduce((s,a)=>s+aggregate(a),0);
    const ta=sectionTotal('1'), tl=sectionTotal('2'), te=sectionTotal('3'), diff=ta-(tl+te);
    const toggle=(code)=>setOpen(o=>({...o,[code]:!o[code]}));
    const renderAcc=(a,depth,prefix)=>{
      const amount=aggregate(a), childs=childrenOf(a.code,prefix).filter(c=>hasReportValue(c,prefix));
      if(!hasReportValue(a,prefix)) return null;
      const hasChildren=childs.length>0;
      const isOpen=!!open[a.code];
      const isProfit=String(a.code)==='340101001';
      return h('div',{key:a.code},
        h('div',{onClick:hasChildren?()=>toggle(a.code):undefined,style:{display:'grid',gridTemplateColumns:'120px 1fr 170px',gap:12,alignItems:'center',padding:'9px 14px',borderTop:'1px solid '+C.beigeL,background:isProfit?(amount>=0?C.successL:C.dangerL):(a.isHeader?C.beigeL:'#fff'),cursor:hasChildren?'pointer':'default'}},
          h('span',{style:{fontFamily:'Yu Gothic Medium',color:C.muted,fontWeight:a.isHeader?900:600}},a.code),
          h('span',{style:{display:'flex',alignItems:'center',gap:8,fontWeight:a.isHeader?950:700,color:a.isHeader?C.navy:undefined,paddingInlineStart:depth*18}},
            hasChildren?h('span',{style:{display:'inline-flex',width:22,height:22,borderRadius:8,alignItems:'center',justifyContent:'center',background:isOpen?C.goldL:'#fff',border:'1px solid '+C.beige,color:C.navy,fontWeight:950}},isOpen?'−':'+'):h('span',{style:{width:22,display:'inline-block'}}),
            h('span',null,accName(a))
          ),
          h('strong',{style:{textAlign:'end',fontFamily:'Yu Gothic Medium',color:isProfit?(amount>=0?C.success:C.danger):undefined}},rNum(Math.abs(amount)))
        ),
        hasChildren && isOpen ? h('div',null,childs.map(c=>renderAcc(c,depth+1,prefix))) : null
      );
    };
    const Section=(prefix,title,color)=>{
      const totalVal=sectionTotal(prefix);
      const roots=topAccounts(prefix).filter(a=>hasReportValue(a,prefix));
      return h('div',{style:{background:'#fff',border:'1px solid '+C.beige,borderRadius:18,overflow:'hidden',marginBottom:14}},
        h('div',{style:{padding:'12px 16px',background:color,fontWeight:900,color:'#fff',display:'flex',justifyContent:'space-between'}},h('span',null,title),h('span',{style:{fontFamily:'Yu Gothic Medium'}},rNum(Math.abs(totalVal)))),
        roots.map(a=>renderAcc(a,0,prefix)),
        h('div',{style:{display:'flex',justifyContent:'space-between',padding:'12px 16px',borderTop:'2px solid '+C.beige,fontWeight:950,background:C.beigeL}},h('span',null,(isEn?'Total ':'إجمالي ')+title),h('span',{style:{fontFamily:'Yu Gothic Medium'}},rNum(Math.abs(totalVal))))
      );
    };
    const html=`<div class="boxwrap"><div class="box"><div class="lbl">${isEn?'Assets':'الأصول'}</div><div class="val num">${rNum(ta)}</div></div><div class="box"><div class="lbl">${isEn?'Liabilities':'الالتزامات'}</div><div class="val num">${rNum(tl)}</div></div><div class="box"><div class="lbl">${isEn?'Equity':'حقوق الملكية'}</div><div class="val num">${rNum(te)}</div></div><div class="box"><div class="lbl">${isEn?'Balance check':'فحص التوازن'}</div><div class="val num">${rNum(diff)}</div></div></div><table><tbody><tr class="section"><td colspan="2">${isEn?'Current Year Profit / Loss':'أرباح / خسائر السنة'}</td><td class="amount">${rNum(periodProfit)}</td></tr></tbody></table>`;
    return h('div',null,
      h(SH,{title:isEn?'Statement of Financial Position':'قائمة المركز المالي',sub:asAtTxt(to),action:h(ActionButtons,{title:isEn?'Statement of Financial Position':'قائمة المركز المالي',html,co,from,to})}),
      h(ReportToolbar,{from,setFrom,to,setTo,compare,setCompare}),
      h('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:16}},
        mini(isEn?'Assets':'الأصول',rNum(ta),'assets',C.navy),
        mini(isEn?'Liabilities':'الالتزامات',rNum(tl),'accounting',C.danger),
        mini(isEn?'Equity':'حقوق الملكية',rNum(te),'money',C.success),
        mini(isEn?'Balance Check':'فحص التوازن',Math.abs(diff)<0.01?(isEn?'Balanced':'متوازن'):rNum(diff),'check',Math.abs(diff)<0.01?C.success:C.danger)
      ),
      Section('1',isEn?'Assets':'الأصول','#1565C0'),
      Section('2',isEn?'Liabilities':'الالتزامات',C.danger),
      Section('3',isEn?'Equity':'حقوق الملكية',C.success)
    );
  };

  PageReports = function PageReports({co}){
    const subs=[{id:'sub_trial',label:T('sub_trial')},{id:'sub_gl',label:T('sub_gl')},{id:'sub_pl',label:T('sub_pl')},{id:'sub_bs',label:T('sub_bs')},{id:'sub_cf',label:T('sub_cf')},{id:'sub_vatreturn',label:T('sub_vatreturn')},{id:'sub_aging',label:T('sub_aging')}];
    const [sub,setSub]=useState('sub_trial');
    const Cmp = sub==='sub_pl'?IncomeStatement:sub==='sub_bs'?BalanceSheet:sub==='sub_cf'?CashFlowReport:sub==='sub_vatreturn'?VATReturn:sub==='sub_gl'?GeneralLedger:sub==='sub_aging'?AgingReport:TrialBalance;
    return h('div',{className:'meyar-reports-page'},h(SubNav,{items:subs,active:sub,onChange:setSub}),h(Safe,null,h(Cmp,{co:safeCo(co)})));
  };
})();
